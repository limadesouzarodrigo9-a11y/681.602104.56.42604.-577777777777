<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11121b"><title>Zend Applications · Entrar</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d0e15;color:#f5f4fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,#292347 0,transparent 52%),#0d0e15}.card{width:min(100%,460px);padding:42px;border:1px solid #ffffff18;border-radius:24px;background:#171822ed;box-shadow:0 24px 90px #0008}.brand{display:flex;align-items:center;gap:13px;margin-bottom:42px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#9d87ff,#6551d6);font-weight:900;font-size:20px}.brand b{font-size:15px;letter-spacing:.08em}.eyebrow{color:#a99bea;font-size:11px;font-weight:800;letter-spacing:.16em}h1{font-size:34px;line-height:1.12;margin:10px 0 14px}p{color:#a7a6b6;line-height:1.6;margin:0 0 28px}.login{display:flex;justify-content:center;align-items:center;gap:11px;width:100%;padding:15px 20px;border:0;border-radius:13px;background:#7562e8;color:white;font-weight:750;font-size:15px;text-decoration:none;transition:.18s}.login:hover{background:#8877f0;transform:translateY(-1px)}.status{min-height:24px;margin-top:20px;font-size:13px;color:#b9b7c8}.guilds{margin-top:24px;display:grid;gap:9px}.guild{padding:12px 14px;border-radius:11px;background:#ffffff09;color:#dfddeb;font-size:13px}.foot{margin-top:38px;color:#777687;font-size:11px}
  </style>
</head>
<body><main class="card"><div class="brand"><div class="mark">Z</div><b>ZEND APPLICATIONS</b></div><div class="eyebrow">PORTAL DA PLATAFORMA</div><h1>Entre com segurança.</h1><p>Use sua conta Discord para ver os servidores que você administra e acessar os recursos autorizados.</p><a class="login" href="/api/oauth/login"><span aria-hidden="true">◉</span> Continuar com Discord</a><div class="status" id="status" role="status"></div><div class="guilds" id="guilds"></div><div class="foot">Sua senha e seus tokens não são compartilhados com este site.</div></main><script>
fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok||!d.authenticated)return;document.querySelector('h1').textContent=`Olá, ${d.user.username}.`;document.querySelector('.login').textContent='Sair da conta';document.querySelector('.login').href='/api/logout';document.querySelector('.login').addEventListener('click',async e=>{e.preventDefault();await fetch('/api/logout',{method:'POST',credentials:'same-origin'});location.reload()});document.querySelector('#status').textContent=d.isAdmin?'Acesso administrativo autorizado.':'Sessão autenticada. Seus servidores administráveis:';const list=document.querySelector("#guilds");for(const guild of d.guilds){const item=document.createElement("div");item.className="guild";item.textContent=guild.name;list.append(item)}}).catch(()=>{});const error=new URLSearchParams(location.search).get('error');if(error)document.querySelector('#status').textContent='Não foi possível entrar. Tente novamente.';
</script></body></html>
